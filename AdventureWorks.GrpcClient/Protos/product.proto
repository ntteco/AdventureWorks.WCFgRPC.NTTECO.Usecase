syntax = "proto3";
package AdventureWorks.GrpcClient.product;
option csharp_namespace = "AdventureWorks.GrpcClient.Protos.Product";

import "google/protobuf/timestamp.proto";

message ProductDto {
  int32 product_id = 1;
  string name = 2;
  string product_number = 3;
  bool make_flag = 4;
  bool finished_goods_flag = 5;
  string color = 6;
  int32 safety_stock_level = 7;
  int32 reorder_point = 8;
  double standard_cost = 9;
  double list_price = 10;
  string size = 11;
  string size_unit_measure_code = 12;
  string weight_unit_measure_code = 13;
  double weight = 14;
  int32 days_to_manufacture = 15;
  string product_line = 16;
  string class_code = 17;
  string style = 18;
  int32 product_subcategory_id = 19;
  int32 product_model_id = 20;
  google.protobuf.Timestamp sell_start_date = 21;
  google.protobuf.Timestamp sell_end_date = 22;
  google.protobuf.Timestamp discontinued_date = 23;
  string rowguid = 24;
  google.protobuf.Timestamp modified_date = 25;
}

message GetProductRequest { int32 product_id = 1; }
message SearchProductsRequest { string query = 1; int32 page = 2; int32 size = 3; }

message PagedProducts {
  repeated ProductDto items = 1;
  int32 page = 2;
  int32 size = 3;
  int32 total_count = 4;
}

message ProductInventoryDto {
  ProductDto product = 1;
  int32 inventory_level = 2;
  string warehouse_info = 3;
}

service ProductService {
  rpc GetProduct(GetProductRequest) returns (ProductDto);
  rpc SearchProducts(SearchProductsRequest) returns (PagedProducts);
  rpc GetProductWithInventory(GetProductRequest) returns (ProductInventoryDto);
}
