syntax = "proto3";
package AdventureWorks.GrpcClient.person;
option csharp_namespace = "AdventureWorks.GrpcClient.Protos.Person";

import "google/protobuf/timestamp.proto";

message PersonDto {
  int32 person_id = 1;
  string person_type = 2;
  int32 name_style = 3;
  string title = 4;
  string first_name = 5;
  string middle_name = 6;
  string last_name = 7;
  string suffix = 8;
  int32 email_promotion = 9;
  string additional_contact_info_raw = 10; // xml
  string demographics_raw = 11; // xml
  string rowguid = 12;
  google.protobuf.Timestamp modified_date = 13;
  string demographics_summary = 14;
  string primary_contact = 15;
}

message PersonListItemDto {
  int32 person_id = 1;
  string first_name = 2;
  string last_name = 3;
  string primary_contact = 4;
  string demographics_summary = 5;
}

message GetPersonRequest { int32 person_id = 1; }
message ListPeopleRequest { int32 page = 1; int32 size = 2; string filter = 3; }
message PersonXmlDto {
  int32 person_id = 1;
  string additional_contact_info_raw = 2;
  string demographics_raw = 3;
  string rowguid = 4;
  google.protobuf.Timestamp modified_date = 5;
}

message PagedPeople {
  repeated PersonListItemDto items = 1;
  int32 page = 2;
  int32 size = 3;
  int32 total_count = 4;
}

service PersonService {
  rpc GetPerson(GetPersonRequest) returns (PersonDto);
  rpc ListPeople(ListPeopleRequest) returns (PagedPeople);
  rpc GetPersonRawXml(GetPersonRequest) returns (PersonXmlDto);
}
